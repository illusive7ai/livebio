<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>livebio for GitHub</title>
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="popup">
    <main>
      <h1>live<span>bio</span></h1>
      <p class="tag">GitHub Wrapped for anyone, from public data</p>
      <form id="form">
        <label for="user">GitHub username</label>
        <div class="field">
          <span aria-hidden="true">@</span>
          <input id="user" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="octocat" />
          <button id="go" class="primary" type="submit">Show Wrapped</button>
        </div>
      </form>
      <div id="out" aria-live="polite"></div>
      <footer class="links">
        <a id="link-site" target="_blank" rel="noreferrer">livebio</a>
        <a id="link-studio" target="_blank" rel="noreferrer">Design studio</a>
        <a id="link-linter" target="_blank" rel="noreferrer">README linter</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
