name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/extension/**
      - packages/core/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The extension's zip goes into the site's public folder first, so the site can offer it for download.
      - run: npm run package -w @livebio/extension
        env:
          LIVEBIO_SERVICE_URL: ${{ vars.CONTRIBUTIONS_URL }}
      - run: npm run build -w @livebio/web
        env:
          # Address of the deployed contribution service. Set it as a repository variable; see workers/contributions/README.md.
          VITE_CONTRIBUTIONS_URL: ${{ vars.CONTRIBUTIONS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
